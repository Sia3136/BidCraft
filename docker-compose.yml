version: '3.8'

# --------------------------------------------------
# DEVELOPMENT DOCKER COMPOSE
# Run: docker compose --profile local up
# Run: docker compose --profile cloud up
# --------------------------------------------------

services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - ./frontend/.env
    networks:
      - bidcraft_network
    profiles:
      - local
      - cloud
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - ./backend/.env
    networks:
      - bidcraft_network
    profiles:
      - local
      - cloud
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"] # Assuming a health route exists or checking root
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bidcraft_user
      POSTGRES_PASSWORD: bidcraft_password
      POSTGRES_DB: bidcraft_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bidcraft_network
    profiles:
      - local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidcraft_user -d bidcraft_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bidcraft_network
    profiles:
      - local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:

networks:
  bidcraft_network:
    driver: bridge
